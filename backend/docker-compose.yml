services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: okoa
      POSTGRES_PASSWORD: okoa
      POSTGRES_DB: okoa_sem
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U okoa -d okoa_sem"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: .
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: development
      PORT: "5000"
      DATABASE_URL: postgresql://okoa:okoa@db:5432/okoa_sem
      FRONTEND_URL: http://localhost:5173
      AUTH_SECRET: dev-secret
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:5000/api/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  postgres_data:
